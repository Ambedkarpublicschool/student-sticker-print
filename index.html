<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Superfast Student Sticker Printer (4x10 Grid)</title>
  <style>
    /* A4 प्रिंट पेज सेटअप - शून्य मार्जिन */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      padding: 0;
    }

    .controls { 
      margin-bottom: 20px; 
      padding: 15px; 
      background: #f0f0f0; 
      border-radius: 5px; 
    }

    select, button { 
      padding: 8px 12px; 
      margin-right: 10px; 
      font-size: 14px; 
      cursor: pointer; 
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 15px; 
    }

    th, td { 
      border: 1px solid #ddd; 
      padding: 8px; 
      text-align: left; 
    }

    th { 
      background-color: #007bff; 
      color: white; 
    }

    /* स्क्रीन पर प्रिंट एरिया छिपाना */
    .sticker-container {
      display: none;
    }

    /* केवल प्रिंट करते समय का CSS */
    @media print {
      .no-print { 
        display: none !important; 
      }
      
      body { 
        margin: 0 !important; 
        padding: 0 !important; 
        background: white;
      }

      /* A4 पेज को 4 कॉलम x 10 रो = 40 भागों में बांटना */
      .sticker-container {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(10, 1fr);
        width: 210mm;
        height: 297mm;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        page-break-after: always;
      }

      .sticker {
        border: 0.2mm dashed #bbb;
        box-sizing: border-box;
        padding: 1mm 1.5mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }

      /* स्कूल का हेडर (नाम और पता) */
      .school-header {
        text-align: center;
        border-bottom: 0.1mm solid #000;
        padding-bottom: 0.5mm;
        margin-bottom: 1mm;
      }

      .school-name {
        font-size: 7.5px;
        font-weight: bold;
        text-transform: uppercase;
        color: #000;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .school-address {
        font-size: 5.5px;
        color: #333;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* छात्र विवरण और फोटो वाला लेआउट */
      .student-body {
        display: flex;
        align-items: center;
        height: 100%;
      }

      .sticker img {
        width: 14mm;
        height: 17mm;
        object-fit: cover;
        margin-right: 1.5mm;
        border: 0.8px solid #555;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .sticker-details {
        line-height: 1.1;
        width: calc(100% - 15.5mm);
        overflow: hidden;
      }

      /* छात्र का नाम - बड़ा और ऑटोमैटिक Wrap */
      .student-name {
        font-size: 9.5px;
        font-weight: bold;
        color: #000;
        white-space: normal;
        word-break: break-word;
        max-height: 20px;
        overflow: hidden;
        margin-bottom: 1px;
      }

      .student-info {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #222;
        font-size: 7.5px;
      }
    }
  </style>
</head>
<body>

  <div class="no-print controls">
    <h2>Student Sticker Printing System</h2>
    <label>Class: </label>
    <select id="classSelect" onchange="filterStudents()">
      <option value="">-- Choose Class --</option>
    </select>

    <label>Section: </label>
    <select id="sectionSelect" onchange="filterStudents()">
      <option value="">-- Choose Section --</option>
    </select>

    <button onclick="generatePrintArea()">Print Preview</button>
  </div>

  <!-- स्टूडेंट टेबल -->
  <table id="studentTable" class="no-print">
    <thead>
      <tr>
        <th>Select</th>
        <th>Roll No</th>
        <th>Name</th>
        <th>Father's Name</th>
        <th>Class</th>
        <th>Section</th>
        <th>No. of Stickers</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      <tr><td colspan="7">डेटा लोड हो रहा है...</td></tr>
    </tbody>
  </table>

  <!-- प्रिंट एरिया (4x10 Grid) -->
  <div id="printArea" class="sticker-container"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx41DDOz-048PiJg7B3RPDUYQh6z17KgUyFVbxEtREuNDLAx_i5meLtJujq_w7Kp9icwQ/exec"; 
    let allData = [];
    let currentFilteredData = [];

    async function loadData() {
      try {
        const res = await fetch(SCRIPT_URL);
        allData = await res.json();
        
        // इमेजेस को बैकग्राउंड में प्री-लोड (Pre-load) करना ताकि प्रिंट के समय तुरंत दिखें
        allData.forEach(student => {
          let fileId = getFileId(student);
          if (fileId) {
            const img = new Image();
            img.src = `https://lh3.googleusercontent.com/d/${fileId}=s150`;
          }
        });

        populateDropdowns();
      } catch (err) {
        alert("डेटा लोड करने में समस्या आई: " + err);
      }
    }

    function getFileId(student) {
      if (student["Photo_ID"]) return student["Photo_ID"];
      if (student["Student Photo Link (Drive)"]) {
        const rawUrl = student["Student Photo Link (Drive)"];
        const match = rawUrl.match(/id=([a-zA-Z0-9_-]+)/) || rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function populateDropdowns() {
      const classes = [...new Set(allData.map(item => item["Current Class"]))].filter(Boolean);
      const sections = [...new Set(allData.map(item => item["Section"]))].filter(Boolean);

      const classSel = document.getElementById("classSelect");
      classSel.innerHTML = '<option value="">-- Choose Class --</option>';
      classes.forEach(c => classSel.innerHTML += `<option value="${c}">${c}</option>`);

      const secSel = document.getElementById("sectionSelect");
      secSel.innerHTML = '<option value="">-- Choose Section --</option>';
      sections.forEach(s => secSel.innerHTML += `<option value="${s}">${s}</option>`);

      filterStudents();
    }

    function filterStudents() {
      const selectedClass = document.getElementById("classSelect").value;
      const selectedSec = document.getElementById("sectionSelect").value;

      currentFilteredData = allData.filter(item => 
        (!selectedClass || String(item["Current Class"]).trim() === String(selectedClass).trim()) &&
        (!selectedSec || String(item["Section"]).trim() === String(selectedSec).trim())
      );

      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";

      if (currentFilteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">कोई रिकॉर्ड नहीं मिला।</td></tr>';
        return;
      }

      currentFilteredData.forEach((student, index) => {
        tbody.innerHTML += `
          <tr>
            <td><input type="checkbox" class="student-check" data-index="${index}"></td>
            <td>${student["Class Roll Number"] || ''}</td>
            <td>${student["Student Name"] || ''}</td>
            <td>${student["Father's Name"] || ''}</td>
            <td>${student["Current Class"] || ''}</td>
            <td>${student["Section"] || ''}</td>
            <td><input type="number" class="sticker-qty" value="1" min="1" style="width:50px;"></td>
          </tr>
        `;
      });
    }

    function generatePrintArea() {
      const printArea = document.getElementById("printArea");
      printArea.innerHTML = "";
      
      const rows = document.querySelectorAll("#studentTableBody tr");
      let selectedAny = false;

      rows.forEach(row => {
        const checkbox = row.querySelector(".student-check");
        if (checkbox && checkbox.checked) {
          selectedAny = true;
          const index = parseInt(checkbox.getAttribute("data-index"));
          const student = currentFilteredData[index];
          const qty = parseInt(row.querySelector(".sticker-qty").value) || 1;

          const fileId = getFileId(student);
          // High speed Google Usercontent Direct Link (=s150 मतलब स्टीकर साइज की परफेक्ट लाइट इमेज)
          const photoUrl = fileId 
            ? `https://lh3.googleusercontent.com/d/${fileId}=s150` 
            : 'https://via.placeholder.com/50';

          const fallbackUrl = fileId 
            ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w100` 
            : 'https://via.placeholder.com/50';

          for (let i = 0; i < qty; i++) {
            printArea.innerHTML += `
              <div class="sticker">
                <div class="school-header">
                  <div class="school-name">Ambedkar Public School</div>
                  <div class="school-address">Madhopur Campierganj GKP</div>
                </div>
                <div class="student-body">
                  <img src="${photoUrl}" 
                       loading="eager" 
                       decoding="async"
                       referrerpolicy="no-referrer"
                       onerror="this.onerror=null; this.src='${fallbackUrl}';" />
                  <div class="sticker-details">
                    <div class="student-name">${student["Student Name"] || ''}</div>
                    <div class="student-info"><b>C/O:</b> ${student["Father's Name"] || ''}</div>
                    <div class="student-info"><b>Class:</b> ${student["Current Class"] || ''} (${student["Section"] || ''})</div>
                  </div>
                </div>
              </div>
            `;
          }
        }
      });

      if (!selectedAny) {
        alert("कृपया कम से कम एक छात्र को चुनें!");
        return;
      }

      // इमेजेस पूरी तरह रेंडर होने के लिए 200ms का छोटा पॉज़ फिर तुरंत प्रिंट पॉप-अप
      setTimeout(() => {
        window.print();
      }, 200);
    }

    loadData();
  </script>
</body>
</html>
