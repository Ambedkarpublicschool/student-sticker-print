<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Student Sticker Printer (4x10 Grids/A4)</title>
  <style>
    /* A4 प्रिंट पेज सेटअप - शून्य मार्जिन */
    @page {
      size: A4 portrait;
      margin: 0; /* प्रिंटर मार्जिन पूरी तरह शून्य */
    }

    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      padding: 0;
    }

    .controls { 
      margin-bottom: 20px; 
      padding: 15px; 
      background: #f0f0f0; 
      border-radius: 5px; 
    }

    select, button { 
      padding: 8px 12px; 
      margin-right: 10px; 
      font-size: 14px; 
      cursor: pointer; 
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 15px; 
    }

    th, td { 
      border: 1px solid #ddd; 
      padding: 8px; 
      text-align: left; 
    }

    th { 
      background-color: #007bff; 
      color: white; 
    }

    /* स्क्रीन पर प्रिंट एरिया छिपाना */
    .sticker-container {
      display: none;
    }

    /* केवल प्रिंट करते समय का CSS */
    @media print {
      .no-print { 
        display: none !important; 
      }
      
      body { 
        margin: 0 !important; 
        padding: 0 !important; 
        background: white;
      }

      /* A4 पेज को 4 कॉलम x 10 रो = 40 भागों में बांटना */
      .sticker-container {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr); /* 4 बराबर कॉलम */
        grid-template-rows: repeat(10, 1fr);   /* 10 बराबर रो */
        width: 210mm;   /* A4 चौड़ाई */
        height: 297mm;  /* A4 लंबाई */
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        page-break-after: always;
      }

      /* प्रत्येक स्टीकर की डिजाइनिंग */
      .sticker {
        border: 0.2mm dashed #bbb; /* कटिंग गाइड के लिए हल्का बॉर्डर */
        box-sizing: border-box;
        padding: 1.5mm;
        display: flex;
        align-items: center;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }

      .sticker img {
        width: 16mm;
        height: 20mm;
        object-fit: cover;
        margin-right: 2mm;
        border: 1px solid #777;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .sticker-details {
        line-height: 1.2;
        width: calc(100% - 18mm);
      }

      .student-name {
        font-size: 11px;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
      }

      .student-info {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #222;
        font-size: 8.5px;
      }
    }
  </style>
</head>
<body>

  <div class="no-print controls">
    <h2>Student Sticker Printing System</h2>
    <label>Class: </label>
    <select id="classSelect" onchange="filterStudents()">
      <option value="">-- Choose Class --</option>
    </select>

    <label>Section: </label>
    <select id="sectionSelect" onchange="filterStudents()">
      <option value="">-- Choose Section --</option>
    </select>

    <button onclick="generatePrintArea()">Print Preview</button>
  </div>

  <!-- स्टूडेंट टेबल -->
  <table id="studentTable" class="no-print">
    <thead>
      <tr>
        <th>Select</th>
        <th>Roll No</th>
        <th>Name</th>
        <th>Father's Name</th>
        <th>Class</th>
        <th>Section</th>
        <th>No. of Stickers</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      <tr><td colspan="7">डेटा लोड हो रहा है...</td></tr>
    </tbody>
  </table>

  <!-- प्रिंट एरिया (4x10 Grid) -->
  <div id="printArea" class="sticker-container"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx41DDOz-048PiJg7B3RPDUYQh6z17KgUyFVbxEtREuNDLAx_i5meLtJujq_w7Kp9icwQ/exec"; 
    let allData = [];
    let currentFilteredData = [];

    async function loadData() {
      try {
        const res = await fetch(SCRIPT_URL);
        allData = await res.json();
        populateDropdowns();
      } catch (err) {
        alert("डेटा लोड करने में समस्या आई: " + err);
      }
    }

    function populateDropdowns() {
      const classes = [...new Set(allData.map(item => item["Current Class"]))].filter(Boolean);
      const sections = [...new Set(allData.map(item => item["Section"]))].filter(Boolean);

      const classSel = document.getElementById("classSelect");
      classSel.innerHTML = '<option value="">-- Choose Class --</option>';
      classes.forEach(c => classSel.innerHTML += `<option value="${c}">${c}</option>`);

      const secSel = document.getElementById("sectionSelect");
      secSel.innerHTML = '<option value="">-- Choose Section --</option>';
      sections.forEach(s => secSel.innerHTML += `<option value="${s}">${s}</option>`);

      filterStudents();
    }

    function filterStudents() {
      const selectedClass = document.getElementById("classSelect").value;
      const selectedSec = document.getElementById("sectionSelect").value;

      currentFilteredData = allData.filter(item => 
        (!selectedClass || String(item["Current Class"]).trim() === String(selectedClass).trim()) &&
        (!selectedSec || String(item["Section"]).trim() === String(selectedSec).trim())
      );

      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";

      if (currentFilteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">कोई रिकॉर्ड नहीं मिला।</td></tr>';
        return;
      }

      currentFilteredData.forEach((student, index) => {
        tbody.innerHTML += `
          <tr>
            <td><input type="checkbox" class="student-check" data-index="${index}"></td>
            <td>${student["Class Roll Number"] || ''}</td>
            <td>${student["Student Name"] || ''}</td>
            <td>${student["Father's Name"] || ''}</td>
            <td>${student["Current Class"] || ''}</td>
            <td>${student["Section"] || ''}</td>
            <td><input type="number" class="sticker-qty" value="1" min="1" style="width:50px;"></td>
          </tr>
        `;
      });
    }

    function generatePrintArea() {
      const printArea = document.getElementById("printArea");
      printArea.innerHTML = "";
      
      const rows = document.querySelectorAll("#studentTableBody tr");
      let selectedAny = false;

      rows.forEach(row => {
        const checkbox = row.querySelector(".student-check");
        if (checkbox && checkbox.checked) {
          selectedAny = true;
          const index = parseInt(checkbox.getAttribute("data-index"));
          const student = currentFilteredData[index];
          const qty = parseInt(row.querySelector(".sticker-qty").value) || 1;

          let photoUrl = "";
          if (student["Photo_ID"]) {
            photoUrl = `https://lh3.googleusercontent.com/d/${student["Photo_ID"]}`;
          } else if (student["Student Photo Link (Drive)"]) {
            const rawUrl = student["Student Photo Link (Drive)"];
            const match = rawUrl.match(/id=([a-zA-Z0-9_-]+)/) || rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
              photoUrl = `https://lh3.googleusercontent.com/d/${match[1]}`;
            } else {
              photoUrl = rawUrl;
            }
          }

          for (let i = 0; i < qty; i++) {
            printArea.innerHTML += `
              <div class="sticker">
                <img src="${photoUrl}" 
                     referrerpolicy="no-referrer" 
                     onerror="this.onerror=null; this.src='https://drive.google.com/thumbnail?id=${student["Photo_ID"]}';" />
                <div class="sticker-details">
                  <div class="student-name">${student["Student Name"] || ''}</div>
                  <div class="student-info"><b>पिता:</b> ${student["Father's Name"] || ''}</div>
                  <div class="student-info"><b>Class:</b> ${student["Current Class"] || ''} (${student["Section"] || ''})</div>
                </div>
              </div>
            `;
          }
        }
      });

      if (!selectedAny) {
        alert("कृपया कम से कम एक छात्र को चुनें!");
        return;
      }

      window.print();
    }

    loadData();
  </script>
</body>
</html>
